<!doctype html>
<html lang="en" data-format="4:5" data-layout="poster">
<head>
<meta charset="utf-8">
<title>example-carousel · slide 1 · poster</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../../../templates/base/base.css">
<style>
  .content { justify-content: space-between; }
  #headline { max-width: 9ch; }
  .foot { display: grid; gap: 34px; }
  #support { max-width: 25ch; }
</style>
</head>
<body>
<main class="canvas on-secondary" data-texture="paper">
  <div class="safe">
    <div class="content">
      <div class="corners"><span id="meta-left" class="label">How we work</span><span id="meta-right" class="label">Weekly</span></div>
      <h1 id="headline" class="t-hero" data-max="26">Your brand, every piece.</h1>
      <div class="foot">
        <span class="rule"></span>
        <p id="support" class="t-intro" data-max="110">How we build the week's content with an agent that knows the brand.</p>
      </div>
    </div>
    <footer class="chrome-bar" data-chrome><span id="brand">@brand</span><span id="pager">01/05</span></footer>
  </div>
</main>
</body>
</html>
