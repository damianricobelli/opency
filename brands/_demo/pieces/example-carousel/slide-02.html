<!doctype html>
<html lang="en" data-format="4:5" data-layout="chat">
<head>
<meta charset="utf-8">
<title>example-carousel · slide 2 · chat</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../../../templates/base/base.css">
<style>
  .content { gap: 40px; }
  #headline { max-width: 14ch; }
  .thread { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 20px; }
  .bubble { max-width: 82%; padding: 30px 38px; border-radius: 40px; font-size: calc(var(--size-body) * 0.92 * var(--k) * 1px); line-height: 1.28; text-wrap: pretty; }
  .bubble.in { align-self: flex-start; border-bottom-left-radius: 8px; background: color-mix(in oklab, var(--ink-inverse) 13%, transparent); }
  .bubble.out { align-self: flex-end; border-bottom-right-radius: 8px; background: var(--ink-inverse); color: var(--primary); }
  #status { align-self: flex-end; margin-top: 8px; }
</style>
</head>
<body>
<main class="canvas on-primary" data-texture="paper">
  <div class="safe">
    <div class="content">
      <h2 id="headline" class="t-title" data-max="44">It starts with a question</h2>
      <div class="thread">
        <p id="in-1" class="bubble in" data-max="60">A carousel about our new hours, for Friday.</p>
        <p id="out-1" class="bubble out" data-max="75">Got it. What should people remember?</p>
        <p id="in-2" class="bubble in" data-max="45">That we open earlier now.</p>
        <p id="out-2" class="bubble out" data-max="75">Here are five slides, checked and ready to review.</p>
        <span id="status" class="chip">0 errors</span>
      </div>
    </div>
    <footer class="chrome-bar" data-chrome><span id="brand">@brand</span><span id="pager">02/05</span></footer>
  </div>
</main>
</body>
</html>
