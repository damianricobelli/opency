<!doctype html>
<html lang="en" data-format="4:5" data-layout="closer">
<head>
<meta charset="utf-8">
<title>example-carousel · slide 5 · closer</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../../../templates/base/base.css">
<style>
  .content { justify-content: space-between; }
  #headline { max-width: 11ch; }
  #cta { display: flex; gap: 24px; align-items: center; justify-content: space-between; padding: 36px 44px; border-radius: var(--radius); background: var(--ink-inverse); color: var(--primary); font-weight: var(--weight-strong); }
  #arrow { font-family: var(--font-display); font-size: 1.3em; line-height: 1; }
</style>
</head>
<body>
<main class="canvas on-primary" data-texture="paper">
  <div class="safe">
    <div class="content">
      <p id="kicker" class="label muted">To wrap up</p>
      <h2 id="headline" class="t-closer" data-max="55">You decide what gets published.</h2>
      <p id="cta" class="t-body"><span id="cta-text" data-max="60">DM us AGENT and we'll show you the workflow</span><span id="arrow">→</span></p>
    </div>
    <footer class="chrome-bar" data-chrome><span id="brand">@brand</span><span id="pager">05/05</span></footer>
  </div>
</main>
</body>
</html>
