<!doctype html>
<html lang="en" data-format="4:5" data-layout="cover-photo">
<head>
<meta charset="utf-8">
<title>layout 02 · cover-photo — cover with a full-bleed photo</title>
<link rel="stylesheet" href="../../brands/_demo/tokens.css">
<link rel="stylesheet" href="../../templates/base/base.css">
<style>
  .content { gap: 28px; }
  #headline { max-width: 11ch; }
  #support { max-width: 22ch; }
</style>
</head>
<body>
<main class="canvas photo-slide" data-texture="film" data-vignette style="--grain:.35">
  <figure class="photo" data-grade="editorial">
    <img data-asset="sample-sunset" src="../../brands/_demo/assets/photos/sample-sunset.jpg" alt="" style="--fx:54%;--fy:50%">
  </figure>
  <div class="veil" data-veil="high" style="--veil:.75"></div>
  <div class="scrim" style="left:-40px;top:120px;width:900px;height:640px;--scrim:.55"></div>
  <div class="safe">
    <div class="content">
      <span id="tag" class="chip">Real story</span>
      <h1 id="headline" class="t-cover" data-max="45">Out running before the sun is up</h1>
      <p id="support" class="t-intro" data-max="95">Six weeks of training, told from the inside.</p>
    </div>
    <footer class="chrome-bar" data-chrome><span id="brand">Brand</span><span id="pager">02/20</span></footer>
  </div>
</main>
</body>
</html>
