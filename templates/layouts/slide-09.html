<!doctype html>
<html lang="en" data-format="4:5" data-layout="testimonial">
<head>
<meta charset="utf-8">
<title>layout 09 · testimonial — ONLY with a real, verified testimonial</title>
<link rel="stylesheet" href="../../brands/_demo/tokens.css">
<link rel="stylesheet" href="../../templates/base/base.css">
<style>
  .content { justify-content: center; gap: 48px; }
  #mark { font-family: var(--font-display); font-weight: var(--weight-display); font-size: 240px; line-height: 1; color: var(--accent); height: 120px; overflow: visible; margin-bottom: 8px; }
  #quote { max-width: 18ch; }
  #who { display: grid; gap: 6px; }
</style>
</head>
<body>
<main class="canvas on-primary" data-texture="film" style="--grain:.3">
  <div class="safe">
    <div class="content">
      <div id="mark" aria-hidden="true">“</div>
      <blockquote id="quote" class="t-subtitle" data-max="95">We stopped requesting pieces by email. Now we review on Monday and they ship on Tuesday.</blockquote>
      <div id="who">
        <p id="name" class="t-body">First Last</p>
        <p id="role" class="label muted">Role · Company</p>
      </div>
    </div>
    <footer class="chrome-bar" data-chrome><span id="brand">Brand</span><span id="pager">09/17</span></footer>
  </div>
</main>
</body>
</html>
