<!doctype html>
<html lang="en" data-format="4:5" data-layout="steps">
<head>
<meta charset="utf-8">
<title>layout 05 · steps — numbered sequence</title>
<link rel="stylesheet" href="../../brands/_demo/tokens.css">
<link rel="stylesheet" href="../../templates/base/base.css">
<style>
  .content { gap: 52px; }
  #headline { max-width: 14ch; }
  ol { list-style: none; margin: 0; padding: 0; flex: 1; min-height: 0; display: grid; grid-auto-rows: 1fr; border-top: 2px solid var(--line); }
  li { display: grid; grid-template-columns: 148px 1fr; align-items: center; border-bottom: 2px solid var(--line); }
  .n { font-family: var(--font-display); font-weight: var(--weight-display); font-size: calc(var(--size-title) * var(--k) * 1px); letter-spacing: var(--tracking-display); line-height: 1; text-transform: none; color: var(--ink-muted); }
  li > span:last-child { max-width: 27ch; }
</style>
</head>
<body>
<main class="canvas on-bg" data-texture="paper">
  <div class="safe">
    <div class="content">
      <h2 id="headline" class="t-title" data-max="48">How we build each piece</h2>
      <ol>
        <li><span class="n label num">01</span><span id="step-1" class="t-body" data-max="48">We pick a single idea per piece.</span></li>
        <li><span class="n label num">02</span><span id="step-2" class="t-body" data-max="48">We write the copy before designing.</span></li>
        <li><span class="n label num">03</span><span id="step-3" class="t-body" data-max="48">We review at phone size.</span></li>
        <li><span class="n label num">04</span><span id="step-4" class="t-body" data-max="48">We save what worked as a template.</span></li>
      </ol>
    </div>
    <footer class="chrome-bar" data-chrome><span id="brand">Brand</span><span id="pager">05/17</span></footer>
  </div>
</main>
</body>
</html>
