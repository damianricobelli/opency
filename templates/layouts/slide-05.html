<!doctype html>
<html lang="es" data-format="4:5" data-layout="steps">
<head>
<meta charset="utf-8">
<title>layout 05 · steps — secuencia numerada</title>
<link rel="stylesheet" href="../../brands/_demo/tokens.css">
<link rel="stylesheet" href="../../templates/base/base.css">
<style>
  .content { gap: 72px; justify-content: center; }
  #headline { max-width: 15ch; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-top: 2px solid var(--line); }
  li { display: grid; grid-template-columns: 96px 1fr; align-items: baseline; padding: 44px 0; border-bottom: 2px solid var(--line); }
  .n { font-family: var(--font-mono); font-size: calc(var(--size-label) * var(--k) * 1px); color: var(--ink-muted); letter-spacing: var(--tracking-label); }
</style>
</head>
<body>
<main class="canvas on-bg" data-texture="paper">
  <div class="safe">
    <div class="content">
      <h2 id="headline" class="t-title" data-max="48">Cómo lo armamos, de punta a punta</h2>
      <ol>
        <li><span class="n label num">01</span><span id="step-1" class="t-body" data-max="48">Elegimos una sola idea por pieza.</span></li>
        <li><span class="n label num">02</span><span id="step-2" class="t-body" data-max="48">Escribimos el copy antes de diseñar.</span></li>
        <li><span class="n label num">03</span><span id="step-3" class="t-body" data-max="48">Revisamos en tamaño teléfono.</span></li>
        <li><span class="n label num">04</span><span id="step-4" class="t-body" data-max="48">Guardamos lo que funcionó como plantilla.</span></li>
      </ol>
    </div>
    <footer class="chrome-bar" data-chrome><span id="brand">Marca</span><span id="pager">05/14</span></footer>
  </div>
</main>
</body>
</html>
