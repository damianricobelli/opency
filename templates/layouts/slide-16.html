<!doctype html>
<html lang="en" data-format="4:5" data-layout="chat">
<head>
<meta charset="utf-8">
<title>Layout 16 · chat</title>
<link rel="stylesheet" href="../../brands/_demo/tokens.css">
<link rel="stylesheet" href="../base/base.css">
<style>
  .content { gap: 40px; }
  #headline { max-width: 14ch; }
  .thread { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 20px; }
  .bubble { max-width: 82%; padding: 30px 38px; border-radius: 40px; font-size: calc(var(--size-body) * 0.92 * var(--k) * 1px); line-height: 1.28; text-wrap: pretty; }
  .bubble.in { align-self: flex-start; border-bottom-left-radius: 8px; background: color-mix(in oklab, var(--ink-inverse) 13%, transparent); }
  .bubble.out { align-self: flex-end; border-bottom-right-radius: 8px; background: var(--ink-inverse); color: var(--primary); }
  #status { align-self: flex-end; margin-top: 8px; }
</style>
</head>
<body>
<main class="canvas on-primary" data-texture="fine" style="--grain:.4">
  <div class="safe">
    <div class="content">
      <h2 id="headline" class="t-title" data-max="44">It all happens in the chat</h2>
      <div class="thread">
        <p id="in-1" class="bubble in" data-max="60">Hi, do you have a table for Friday?</p>
        <p id="out-1" class="bubble out" data-max="75">Yes: 8:00, 9:30 or 10:15. Which one works?</p>
        <p id="in-2" class="bubble in" data-max="45">9:30 for four, please.</p>
        <p id="out-2" class="bubble out" data-max="75">Done. Here is the link to confirm it.</p>
        <span id="status" class="chip">Booked</span>
      </div>
    </div>
    <footer class="chrome-bar" data-chrome><span id="brand">Brand</span><span id="pager">16/20</span></footer>
  </div>
</main>
</body>
</html>
