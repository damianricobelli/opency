<!doctype html>
<html lang="en" data-format="4:5" data-layout="photo-card">
<head>
<meta charset="utf-8">
<title>Layout 07 · photo-card</title>
<link rel="stylesheet" href="../../brands/_demo/tokens.css">
<link rel="stylesheet" href="../base/base.css">
<style>
  .photo { inset: 0 0 auto 0; height: 820px; }
  .fade { position: absolute; left: 0; right: 0; top: 380px; height: 442px; z-index: 1; background: linear-gradient(to bottom, transparent, var(--primary) 92%); }
  .content { justify-content: flex-end; gap: 26px; }
  #headline { max-width: 15ch; }
  #support { max-width: 28ch; }
</style>
</head>
<body>
<main class="canvas on-primary" data-texture="film" style="--grain:.4">
  <figure class="photo" data-grade="editorial">
    <img data-asset="sample-sunset" src="../../brands/_demo/assets/photos/sample-sunset.jpg" alt="" style="--fx:54%;--fy:50%">
  </figure>
  <div class="fade" data-bleed></div>
  <div class="safe">
    <div class="content">
      <p id="kicker" class="label accent-text">Week 3</p>
      <h2 id="headline" class="t-title" data-max="60">Pace is built on short, steady runs</h2>
      <p id="support" class="t-intro muted" data-max="95">Four 30-minute runs did more than two long ones.</p>
    </div>
    <footer class="chrome-bar" data-chrome><span id="brand">Brand</span><span id="pager">07/17</span></footer>
  </div>
</main>
</body>
</html>
