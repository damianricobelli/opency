<!doctype html>
<html lang="en" data-format="4:5" data-layout="photo-card">
<head>
<meta charset="utf-8">
<title>layout 07 · photo-card — photo on top, text card below</title>
<link rel="stylesheet" href="../../brands/_demo/tokens.css">
<link rel="stylesheet" href="../../templates/base/base.css">
<style>
  .photo { inset: 0 0 auto 0; height: 720px; }
  .content { justify-content: flex-end; }
  .card { display: grid; gap: 22px; }
  #headline { max-width: 17ch; }
</style>
</head>
<body>
<main class="canvas on-alt" data-texture="fine" style="--grain:.3">
  <figure class="photo" data-grade="immersive">
    <img data-asset="sample-sunset" src="../../brands/_demo/assets/photos/sample-sunset.jpg" alt="" style="--fx:54%;--fy:50%">
  </figure>
  <div class="safe">
    <div class="content">
      <div class="card">
        <p id="kicker" class="label muted">Week 3</p>
        <h2 id="headline" class="t-subtitle" data-max="95">Pace is built on short, steady runs</h2>
        <p id="support" class="t-intro muted" data-max="95">Four 30-minute runs did more than two long ones.</p>
      </div>
    </div>
    <footer class="chrome-bar" data-chrome><span id="brand">Brand</span><span id="pager">07/14</span></footer>
  </div>
</main>
</body>
</html>
