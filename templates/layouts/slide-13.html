<!doctype html>
<html lang="en" data-format="4:5" data-layout="logo-grid">
<head>
<meta charset="utf-8">
<title>layout 13 · logo-grid — customers, partners or tools (ONLY with permission)</title>
<link rel="stylesheet" href="../../brands/_demo/tokens.css">
<link rel="stylesheet" href="../../templates/base/base.css">
<style>
  .content { gap: 60px; justify-content: center; }
  #headline { max-width: 14ch; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 2px solid var(--line); border-left: 2px solid var(--line); }
  .tile { aspect-ratio: 4 / 3; display: grid; place-items: center; border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); padding: 24px; }
  .tile img { max-width: 70%; max-height: 56%; object-fit: contain; }
  .tile .label { color: var(--ink-muted); }
</style>
</head>
<body>
<main class="canvas on-bg" data-texture="paper">
  <div class="safe">
    <div class="content">
      <div>
        <p id="kicker" class="label muted" style="margin-bottom:22px">Who we work with</p>
        <h1 id="headline" class="t-title" data-max="48">Teams that already publish with us</h1>
      </div>
      <!-- Each tile takes the customer's <img class="logo" data-role="logo" src="../../assets/logos/…">. The texts are placeholders. -->
      <div class="grid" data-fill>
        <div class="tile"><span id="l1" class="label">Logo 1</span></div>
        <div class="tile"><span id="l2" class="label">Logo 2</span></div>
        <div class="tile"><span id="l3" class="label">Logo 3</span></div>
        <div class="tile"><span id="l4" class="label">Logo 4</span></div>
        <div class="tile"><span id="l5" class="label">Logo 5</span></div>
        <div class="tile"><span id="l6" class="label">Logo 6</span></div>
      </div>
    </div>
    <footer class="chrome-bar" data-chrome><span id="brand">Brand</span><span id="pager">13/20</span></footer>
  </div>
</main>
</body>
</html>
