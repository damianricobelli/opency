<!doctype html>
<html lang="en" data-format="4:5" data-layout="comparison">
<head>
<meta charset="utf-8">
<title>layout 06 · comparison — before and now / A versus B</title>
<link rel="stylesheet" href="../../brands/_demo/tokens.css">
<link rel="stylesheet" href="../../templates/base/base.css">
<style>
  .content { gap: 64px; justify-content: center; }
  #headline { max-width: 15ch; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: stretch; }
  .col { display: grid; gap: 30px; align-content: start; padding: 44px 40px 52px; }
  .before { background: var(--bg-alt); }
  .now { border: 3px solid var(--accent); }
  .now .label { display: inline-flex; align-items: center; gap: 14px; }
  .now .label::before { content: ""; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); }
  .item { padding-top: 28px; border-top: 2px solid var(--line); }
</style>
</head>
<body>
<main class="canvas on-bg" data-texture="paper">
  <div class="safe">
    <div class="content">
      <h2 id="headline" class="t-title" data-max="48">What changed in the process</h2>
      <div class="cols">
        <div class="col before">
          <p id="before-label" class="label">Before</p>
          <p id="before-1" class="item t-body" data-max="30">One brief per post</p>
          <p id="before-2" class="item t-body" data-max="30">Three rounds of changes</p>
          <p id="before-3" class="item t-body" data-max="30">Design from scratch</p>
        </div>
        <div class="col now">
          <p id="now-label" class="label">Now</p>
          <p id="now-1" class="item t-body" data-max="30">One request by chat</p>
          <p id="now-2" class="item t-body" data-max="30">One specific fix</p>
          <p id="now-3" class="item t-body" data-max="30">Approved templates</p>
        </div>
      </div>
    </div>
    <footer class="chrome-bar" data-chrome><span id="brand">Brand</span><span id="pager">06/20</span></footer>
  </div>
</main>
</body>
</html>
