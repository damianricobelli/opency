<!doctype html>
<html lang="es" data-format="4:5" data-layout="comparison">
<head>
<meta charset="utf-8">
<title>layout 06 · comparison — antes y ahora / A contra B</title>
<link rel="stylesheet" href="../../brands/_demo/tokens.css">
<link rel="stylesheet" href="../../templates/base/base.css">
<style>
  .content { gap: 64px; justify-content: center; }
  #headline { max-width: 15ch; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: stretch; }
  .col { display: grid; gap: 30px; align-content: start; padding: 44px 40px 52px; }
  .before { background: var(--bg-alt); }
  .now { border: 3px solid var(--accent); }
  .now .label { display: inline-flex; align-items: center; gap: 14px; }
  .now .label::before { content: ""; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); }
  .item { padding-top: 28px; border-top: 2px solid var(--line); }
</style>
</head>
<body>
<main class="canvas on-bg" data-texture="paper">
  <div class="safe">
    <div class="content">
      <h2 id="headline" class="t-title" data-max="48">Qué cambió en el proceso</h2>
      <div class="cols">
        <div class="col before">
          <p id="before-label" class="label">Antes</p>
          <p id="before-1" class="item t-body" data-max="30">Un brief por post</p>
          <p id="before-2" class="item t-body" data-max="30">Tres rondas de cambios</p>
          <p id="before-3" class="item t-body" data-max="30">Diseño desde cero</p>
        </div>
        <div class="col now">
          <p id="now-label" class="label">Ahora</p>
          <p id="now-1" class="item t-body" data-max="30">Un pedido por chat</p>
          <p id="now-2" class="item t-body" data-max="30">Una corrección puntual</p>
          <p id="now-3" class="item t-body" data-max="30">Plantillas aprobadas</p>
        </div>
      </div>
    </div>
    <footer class="chrome-bar" data-chrome><span id="brand">Marca</span><span id="pager">06/14</span></footer>
  </div>
</main>
</body>
</html>
