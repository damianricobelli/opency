<!doctype html>
<html lang="es" data-format="4:5" data-layout="data-bars">
<head>
<meta charset="utf-8">
<title>layout 08 · data-bars — comparación de cantidades</title>
<link rel="stylesheet" href="../../brands/_demo/tokens.css">
<link rel="stylesheet" href="../../templates/base/base.css">
<style>
  .content { gap: 60px; }
  #headline { max-width: 15ch; }
  .chart { display: grid; gap: 34px; }
  .row { display: grid; gap: 12px; }
  .meta { display: flex; justify-content: space-between; align-items: baseline; }
  .bar { height: 26px; background: var(--bg-alt); }
  .bar > i { display: block; height: 100%; width: var(--v); background: var(--ink); }
  .row.hi .bar > i { background: var(--accent); }
  .val { font-family: var(--font-display); font-weight: var(--weight-title); }
  #source { margin-top: auto; }
</style>
</head>
<body>
<main class="canvas on-bg" data-texture="paper">
  <div class="safe">
    <div class="content">
      <h2 id="headline" class="t-title" data-max="48">Dónde se va el tiempo de una pieza</h2>
      <div class="chart">
        <div class="row"><div class="meta"><span id="l1" class="t-body">Idea</span><span id="v1" class="t-body val num">1 h</span></div><div class="bar"><i style="--v:22%"></i></div></div>
        <div class="row hi"><div class="meta"><span id="l2" class="t-body">Diseño</span><span id="v2" class="t-body val num">3 h</span></div><div class="bar"><i style="--v:66%"></i></div></div>
        <div class="row"><div class="meta"><span id="l3" class="t-body">Revisión</span><span id="v3" class="t-body val num">1 h</span></div><div class="bar"><i style="--v:22%"></i></div></div>
        <div class="row"><div class="meta"><span id="l4" class="t-body">Publicación</span><span id="v4" class="t-body val num">30 min</span></div><div class="bar"><i style="--v:11%"></i></div></div>
      </div>
      <p id="source" class="label muted">Fuente: registro interno (dato de ejemplo)</p>
    </div>
    <footer class="chrome-bar" data-chrome><span id="brand">Marca</span><span id="pager">08/14</span></footer>
  </div>
</main>
</body>
</html>
