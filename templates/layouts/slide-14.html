<!doctype html>
<html lang="en" data-format="4:5" data-layout="cobrand">
<head>
<meta charset="utf-8">
<title>layout 14 · cobrand — shared announcement with another brand, over a photo</title>
<link rel="stylesheet" href="../../brands/_demo/tokens.css">
<link rel="stylesheet" href="../../templates/base/base.css">
<style>
  .content { justify-content: flex-start; align-items: center; text-align: center; gap: 40px; padding-top: 110px; }
  .lockup { display: flex; align-items: center; gap: 36px; font-family: var(--font-display); font-weight: var(--weight-display); font-size: calc(var(--size-title) * var(--k) * 1px); letter-spacing: var(--tracking-title); line-height: 1; }
  .lockup img { height: 84px; width: auto; }
  #x { font-weight: 400; opacity: .7; }
  #support { max-width: 22ch; }
</style>
</head>
<body>
<main class="canvas photo-slide" data-texture="film" data-vignette style="--grain:.35">
  <figure class="photo" data-grade="editorial">
    <img data-asset="sample-sunset" src="../../brands/_demo/assets/photos/sample-sunset.jpg" alt="" style="--fx:54%;--fy:40%">
  </figure>
  <div class="veil" data-veil="flat" style="--veil:.62"></div>
  <div class="safe">
    <div class="content">
      <!-- Replace the lockup texts with an <img> of each logo (the variant for dark backgrounds). -->
      <div class="lockup"><span id="a">Brand</span><span id="x">×</span><span id="b">Partner</span></div>
      <p id="support" class="t-body" data-max="110">Since December we train together every Saturday.</p>
    </div>
    <footer class="chrome-bar" data-chrome><span id="brand">Brand</span><span id="pager">14/20</span></footer>
  </div>
</main>
</body>
</html>
