<!doctype html>
<html lang="en" data-format="4:5" data-layout="poster">
<head>
<meta charset="utf-8">
<title>Layout 15 · poster</title>
<link rel="stylesheet" href="../../brands/_demo/tokens.css">
<link rel="stylesheet" href="../base/base.css">
<style>
  .content { justify-content: space-between; }
  #headline { max-width: 9ch; }
  .foot { display: grid; gap: 34px; }
  #support { max-width: 25ch; }
</style>
</head>
<body>
<main class="canvas on-secondary" data-texture="fine" style="--grain:.45">
  <div class="safe">
    <div class="content">
      <div class="corners"><span id="meta-left" class="label">The rule</span><span id="meta-right" class="label">No. 12</span></div>
      <h1 id="headline" class="t-hero" data-max="26">Say one thing well.</h1>
      <div class="foot">
        <span class="rule"></span>
        <p id="support" class="t-intro" data-max="110">A piece that says two things is remembered for neither. Pick the one that matters.</p>
      </div>
    </div>
    <footer class="chrome-bar" data-chrome><span id="brand">Brand</span><span id="pager">15/20</span></footer>
  </div>
</main>
</body>
</html>
