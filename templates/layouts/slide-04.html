<!doctype html>
<html lang="es" data-format="4:5" data-layout="big-number">
<head>
<meta charset="utf-8">
<title>layout 04 · big-number — una cantidad dueña del slide</title>
<link rel="stylesheet" href="../../brands/_demo/tokens.css">
<link rel="stylesheet" href="../../templates/base/base.css">
<style>
  .content { justify-content: space-between; }
  #number { font-size: calc(var(--size-hero) * 2.1 * var(--k) * 1px); line-height: .9; color: var(--ink); }
  .rule { margin: 36px 0 40px; }
  #headline { max-width: 14ch; }
  #support { max-width: 26ch; margin-top: 28px; }
</style>
</head>
<body>
<main class="canvas on-alt" data-texture="fine" style="--grain:.35">
  <div class="safe">
    <div class="content">
      <p id="kicker" class="label">Método</p>
      <div>
        <p id="number" class="t-hero num">5</p>
        <div class="rule"></div>
        <h2 id="headline" class="t-title" data-max="48">pasos para armar un carrusel en una tarde</h2>
        <p id="support" class="t-intro muted" data-max="95">De la idea al archivo listo, sin abrir un editor.</p>
      </div>
    </div>
    <footer class="chrome-bar" data-chrome><span id="brand">Marca</span><span id="pager">04/14</span></footer>
  </div>
</main>
</body>
</html>
