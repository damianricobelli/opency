<!doctype html>
<html lang="en" data-format="4:5" data-layout="event">
<head>
<meta charset="utf-8">
<title>Layout 20 · event</title>
<link rel="stylesheet" href="../../brands/_demo/tokens.css">
<link rel="stylesheet" href="../base/base.css">
<style>
  .content { justify-content: space-between; }
  #tag { align-self: flex-start; }
  .bill { display: grid; gap: 22px; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .facts > :nth-child(2) { text-align: center; }
  .facts > :nth-child(3) { text-align: right; }
  #headline { font-size: calc(var(--size-hero) * 0.86 * var(--k) * 1px); line-height: 0.96; }
</style>
</head>
<body>
<main class="canvas photo-slide" data-texture="film" data-vignette style="--grain:.4">
  <figure class="photo" data-grade="editorial">
    <img data-asset="sample-sunset" src="../../brands/_demo/assets/photos/sample-sunset.jpg" alt="" style="--fx:54%;--fy:50%">
  </figure>
  <div class="veil" data-veil="flat" style="--veil:.38"></div>
  <div class="veil" data-veil="high" style="--veil:.9"></div>
  <div class="safe">
    <div class="content">
      <div class="bill">
        <div class="facts"><span id="f1" class="label">Sunday</span><span id="f2" class="label">August</span><span id="f3" class="label">Morning</span></div>
        <h1 id="headline" class="t-hero" data-max="16">Open run day</h1>
        <div class="facts"><span id="f4" class="label">Riverside park</span><span id="f5" class="label">All paces</span><span id="f6" class="label">North gate</span></div>
      </div>
      <span id="tag" class="chip">Free entry</span>
    </div>
    <footer class="chrome-bar" data-chrome><span id="brand">Brand</span><span id="pager">20/20</span></footer>
  </div>
</main>
</body>
</html>
