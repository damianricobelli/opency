<!doctype html>
<html lang="en" data-format="4:5" data-layout="closer">
<head>
<meta charset="utf-8">
<title>layout 10 · closer — close with a single named CTA</title>
<link rel="stylesheet" href="../../brands/_demo/tokens.css">
<link rel="stylesheet" href="../../templates/base/base.css">
<style>
  .content { justify-content: space-between; }
  #headline { max-width: 11ch; }
  #cta { display: flex; gap: 24px; align-items: baseline; justify-content: space-between; padding-top: 34px; border-top: 4px solid var(--accent); font-weight: var(--weight-strong); }
  #arrow { font-family: var(--font-display); }
</style>
</head>
<body>
<main class="canvas on-bg" data-texture="paper">
  <div class="safe">
    <div class="content">
      <p id="kicker" class="label muted">To wrap up</p>
      <h2 id="headline" class="t-closer" data-max="55">One idea per piece. Always.</h2>
      <p id="cta" class="t-body"><span id="cta-text" data-max="60">DM us PLAN and we'll send you the template</span><span id="arrow">→</span></p>
    </div>
    <footer class="chrome-bar" data-chrome><span id="brand">@brand</span><span id="pager">10/14</span></footer>
  </div>
</main>
</body>
</html>
