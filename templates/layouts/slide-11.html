<!doctype html>
<html lang="en" data-format="4:5" data-layout="news-cards">
<head>
<meta charset="utf-8">
<title>layout 11 · news-cards — roundup of several news items in cards</title>
<link rel="stylesheet" href="../../brands/_demo/tokens.css">
<link rel="stylesheet" href="../../templates/base/base.css">
<style>
  .content { gap: 48px; justify-content: space-between; }
  .cards { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 18px; }
  .nc { background: var(--bg); border: 2px solid var(--line); border-radius: var(--radius); padding: 26px 28px 30px; display: grid; gap: 14px; align-content: start; }
  .nc .label { color: var(--ink-muted); }
  .nc:first-child { background: var(--primary); color: var(--ink-inverse); border-color: transparent; }
  .nc:first-child .label { color: var(--ink-inverse-muted); }
  .nc p:last-child { font-size: calc(var(--size-body) * var(--k) * 1px); line-height: 1.22; font-weight: var(--weight-strong); }
  #headline { max-width: 14ch; }
</style>
</head>
<body>
<main class="canvas on-alt" data-texture="paper">
  <div class="safe">
    <div class="content">
      <div class="cards">
        <div class="nc"><p id="t1" class="label">Product</p><p id="n1" data-max="46">We launched the new reports dashboard</p></div>
        <div class="nc"><p id="t2" class="label">Team</p><p id="n2" data-max="46">Two new people joined support</p></div>
        <div class="nc"><p id="t3" class="label">Events</p><p id="n3" data-max="46">Open talk this Thursday at 6 pm</p></div>
        <div class="nc"><p id="t4" class="label">Guide</p><p id="n4" data-max="46">How to organize your monthly calendar</p></div>
      </div>
      <div>
        <p id="kicker" class="label" style="margin-bottom:20px">Issue 12</p>
        <h1 id="headline" class="t-title" data-max="48">What happened at the brand this week</h1>
      </div>
    </div>
    <footer class="chrome-bar" data-chrome><span id="brand">Brand</span><span id="pager">11/14</span></footer>
  </div>
</main>
</body>
</html>
