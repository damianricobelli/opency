<!doctype html>
<html lang="es" data-format="{{FORMAT}}" data-layout="base">
<head>
<meta charset="utf-8">
<title>{{PIECE_ID}} · slide {{N}}</title>
<link rel="stylesheet" href="../../brands/_demo/tokens.css">
<link rel="stylesheet" href="../../templates/base/base.css">
<style>
  /* Estilos de este slide: solo var(--…) de tokens.css para color y tipografía. */
  .content { justify-content: space-between; }
  #headline { max-width: 11ch; }
  #support { max-width: 24ch; margin-top: 32px; }
</style>
</head>
<body>
<main class="canvas on-bg" data-texture="fine">
  <div class="safe">
    <div class="content">
      <p id="kicker" class="label muted">{{ETIQUETA}}</p>
      <div>
        <h1 id="headline" class="t-cover" data-max="45">{{TITULAR}}</h1>
        <p id="support" class="t-intro muted" data-max="95">{{BAJADA}}</p>
      </div>
    </div>
    <footer class="chrome-bar" data-chrome><span id="brand">{{MARCA}}</span><span id="pager">{{N}}/{{TOTAL}}</span></footer>
  </div>
</main>
</body>
</html>
